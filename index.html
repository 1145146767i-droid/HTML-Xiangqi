<body><div class="app"><h1>中国象棋</h1><div class="sub">楚河汉界 · 红方先行</div>
<div class="game"><div class="board-wrap"><div id="board" class="board"><div class="grid"></div><div class="river"><span>楚河</span><span>汉界</span></div><div class="palace"></div><div class="palace bottom"></div></div></div>
<div class="panel"><div class="status"><div>当前回合</div><div id="turn" class="turn"></div><div id="message">请选择棋子</div></div><div class="buttons"><button id="reset">重新开始</button><button id="undo">悔棋</button><button id="aiToggle">🤖 AI：关闭</button><button id="aiDepth">难度：随机优选</button></div><div id="moves" class="moves">暂无走棋记录</div><div class="tip">绿色圆点=可走位置，红圈=可吃子位置，蓝框=最后一步。棋谱按红方汉字路数、黑方阿拉伯路数记录，将军用 + 标记；三次完全重复局面会判和。</div></div></div></div>
<script>
const board=document.querySelector("#board"),turnEl=document.querySelector("#turn"),msg=document.querySelector("#message"),movesEl=document.querySelector("#moves");
const name={K:"帅",A:"仕",B:"相",N:"马",R:"车",C:"炮",P:"兵",k:"将",a:"士",b:"象",n:"马",r:"车",c:"炮",p:"卒"};
const red=c=>/[KABNRCP]/.test(c),inside=(x,y)=>x>=0&&x<9&&y>=0&&y<10;
const redFiles=["零","一","二","三","四","五","六","七","八","九"];
function route(x,isRed){return isRed?9-x:x+1}
function routeText(x,isRed){return isRed?redFiles[route(x,true)]:String(route(x,false))}
let pieces=[],side="red",selected=null,history=[],last=null,over=false,positionCounts={},aiEnabled=false,aiThinking=false,aiLevel=1;

function positionKey(){return side+"|"+pieces.map(p=>p.c+","+p.x+","+p.y).sort().join(";")}
function initial(){pieces=[["r",0,0],["n",1,0],["b",2,0],["a",3,0],["k",4,0],["a",5,0],["b",6,0],["n",7,0],["r",8,0],["c",1,2],["c",7,2],["p",0,3],["p",2,3],["p",4,3],["p",6,3],["p",8,3],["R",0,9],["N",1,9],["B",2,9],["A",3,9],["K",4,9],["A",5,9],["B",6,9],["N",7,9],["R",8,9],["C",1,7],["C",7,7],["P",0,6],["P",2,6],["P",4,6],["P",6,6],["P",8,6]].map(([c,x,y])=>({c,x,y}));side="red";selected=null;history=[];last=null;over=false;positionCounts={};positionCounts[positionKey()]=1;msg.textContent="请选择一个红方棋子";render();renderMoves()}
function at(x,y){return pieces.find(p=>p.x===x&&p.y===y)}
function lineCount(x1,y1,x2,y2){let dx=Math.sign(x2-x1),dy=Math.sign(y2-y1),x=x1+dx,y=y1+dy,n=0;while(x!==x2||y!==y2){if(at(x,y))n++;x+=dx;y+=dy}return n}
function inPalace(p,x,y){return x>=3&&x<=5&&(red(p.c)?y>=7:y<=2)}
function attackPseudo(p,x,y){return pseudo(p,x,y,true)}
function pseudo(p,x,y,attack=false){
 let dx=x-p.x,dy=y-p.y,ax=Math.abs(dx),ay=Math.abs(dy),dest=at(x,y);
 if(!inside(x,y)||(dx===0&&dy===0)||(!attack&&dest&&red(dest.c)===red(p.c)))return false;
 switch(p.c.toLowerCase()){
 case"k": return ax+ay===1&&inPalace(p,x,y);
 case"a": return ax===1&&ay===1&&inPalace(p,x,y);
 case"b": return ax===2&&ay===2&&(red(p.c)?y>=5:y<=4)&&!at(p.x+dx/2,p.y+dy/2);
 case"n": return ax*ay===2&&!at(p.x+(ax===1?0:dx/2),p.y+(ay===1?0:dy/2));
 case"r": return (dx===0||dy===0)&&lineCount(p.x,p.y,x,y)===0;
 case"c": return (dx===0||dy===0)&&lineCount(p.x,p.y,x,y)===(dest?1:0);
 case"p":{
   const forward=red(p.c)?-1:1, crossed=red(p.c)?p.y<=4:p.y>=5;
   return dy===forward&&(dx===0||(crossed&&ax===1));
 }
 }return false
}
function inCheck(color){
 const king=pieces.find(p=>p.c===(color==="red"?"K":"k"));if(!king)return true;
 return pieces.some(p=>red(p.c)!== (color==="red") && attackPseudo(p,king.x,king.y));
}
function faceToFace(){
 const K=pieces.find(p=>p.c==="K"),k=pieces.find(p=>p.c==="k");return K&&k&&K.x===k.x&&lineCount(K.x,K.y,k.x,k.y)===0;
}
function legal(p,x,y){
 if(!pseudo(p,x,y))return false;
 const dest=at(x,y),idx=dest?pieces.indexOf(dest):-1,ox=p.x,oy=p.y;
 if(dest&&dest.c.toLowerCase()==="k")return false;
 if(idx>=0)pieces.splice(idx,1);p.x=x;p.y=y;
 const bad=inCheck(red(p.c)?"red":"black")||faceToFace();
 p.x=ox;p.y=oy;if(idx>=0)pieces.splice(idx,0,dest);
 return !bad;
}
function movesFor(p){const out=[];for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(legal(p,x,y))out.push([x,y]);return out}
function allMoves(color){const out=[];for(const p of pieces)if(red(p.c)===(color==="red")&&movesFor(p).length)out.push(p);return out}
function disambiguator(p,ox,oy){
 const same=pieces.filter(q=>q!==p&&q.c===p.c&&q.x===ox);
 if(!same.length)return null;
 const front=red(p.c)?q=>q.y<oy:q=>q.y>oy;
 return front(p)?"前":"后";
}
function notation(p,ox,oy,nx,ny){
 const isRed=red(p.c),prefix=name[p.c],amb=disambiguator(p,ox,oy),dy=ny-oy,forward=isRed?-1:1;
 let action,detail;
 if(ox===nx){action=dy*forward>0?"进":"退";detail=Math.abs(dy)}
 else{action="平";detail=route(nx,isRed)}
 const type=p.c.toLowerCase(),lead=amb||prefix;
 const startText=amb?"":routeText(ox,isRed);
 const endText=(action==="平"||["n","b","a"].includes(type))?routeText(nx,isRed):(isRed?redFiles[detail]:String(detail));
 return lead+startText+action+endText;
}
function makeMove(p,x,y){
 const ox=p.x,oy=p.y,dest=at(x,y),snap={pieces:pieces.map(q=>({...q})),side,last:last?{...last}:null,positionCounts:{...positionCounts}};
 history.push(snap);
 if(dest)pieces.splice(pieces.indexOf(dest),1);
 p.x=x;p.y=y;last={ox,oy,x,y};side=side==="red"?"black":"red";selected=null;
 const chk=inCheck(side),moves=allMoves(side),key=positionKey();
 positionCounts[key]=(positionCounts[key]||0)+1;
 let note=notation(p,ox,oy,x,y);
 if(chk)note+=" +";
 history[history.length-1].note=note;history[history.length-1].check=chk;
 if(positionCounts[key]>=3){over=true;msg.textContent="三次重复局面，和棋！"}
 else if(!moves.length){over=true;msg.textContent=chk?(side==="red"?"红方被将死，黑方胜！":"黑方被将死，红方胜！"):(side==="red"?"红方被困毙，黑方胜！":"黑方被困毙，红方胜！")}
 else msg.textContent=chk?(side==="red"?"红方被将军！必须应将":"黑方被将军！必须应将"):"请选择一个"+(side==="red"?"红":"黑")+"方棋子";
 render();renderMoves();scheduleAi()
}
function pieceValue(c){
 const t=c.toLowerCase();
 if(t==="k")return 10000;
 if(t==="r")return 9;
 if(t==="c")return 4.5;
 if(t==="n")return 4;
 if(t==="a"||t==="b")return 2;
 if(t==="p")return 1;
 return 0;
}
function evalBoard(){
 let score=0;
 for(const p of pieces){
  const t=p.c.toLowerCase(),v=t==="k"?10000:t==="r"?9:t==="c"?4.5:t==="n"?4:(t==="a"||t==="b")?2:(red(p.c)&&p.y<=4)||(!red(p.c)&&p.y>=5)?2:1;
  const center=(4-Math.abs(4-p.x))*0.08;
  const advance=t==="p"?((red(p.c)?9-p.y:p.y)*0.12):0;
  const val=v+center+advance;
  score+=(red(p.c)?-val:val);
 }
 return score;
}
function simulateMove(p,x,y,fn){
 const order=pieces.slice();
 const coords=order.map(q=>[q,q.x,q.y]);
 const dest=at(x,y);
 if(dest)pieces.splice(pieces.indexOf(dest),1);
 const ox=p.x,oy=p.y;
 p.x=x;p.y=y;
 try{return fn(p,dest)}
 finally{
  for(const [q,qx,qy] of coords){q.x=qx;q.y=qy}
  pieces.length=0;
  for(const q of order)pieces.push(q);
  p.x=ox;p.y=oy;
 }
}
function simulateScore(p,x,y){
 return simulateMove(p,x,y,()=>{
  let score=evalBoard();
  if(inCheck("red"))score+=1.5;
  return score;
 });
}
function replyScoreAfterBlackMove(p,x,y){
 return simulateMove(p,x,y,()=>{
  if(inCheck("red")){
   const replies=allMoves("red");
   if(!replies.length)return 100000;
  }
  const replies=allMoves("red");
  if(!replies.length)return inCheck("red")?100000:0;
  let worstForBlack=Infinity;
  for(const rp of replies){
   for(const [rx,ry] of movesFor(rp)){
    const s=simulateMove(rp,rx,ry,()=>evalBoard());
    if(s<worstForBlack)worstForBlack=s;
   }
  }
  return worstForBlack;
 });
}
function chooseAiMove(){
 const candidates=[];
 for(const p of pieces)if(!red(p.c)){
  for(const [x,y] of movesFor(p)){
   const captured=at(x,y);
   let score;
   if(aiLevel===1){
    score=simulateScore(p,x,y);
    if(captured)score+=pieceValue(captured.c)*0.35;
   }else{
    score=replyScoreAfterBlackMove(p,x,y);
    if(captured)score+=pieceValue(captured.c)*0.2;
   }
   candidates.push({p,x,y,score});
  }
 }
 if(!candidates.length)return null;
 candidates.sort((a,b)=>b.score-a.score);
 const pool=aiLevel===1?candidates.slice(0,Math.min(3,candidates.length)):candidates.slice(0,Math.min(2,candidates.length));
 return pool[Math.floor(Math.random()*pool.length)];
}
let aiTimerToken=0;
function scheduleAi(){
 if(!aiEnabled||side!=="black"||over||aiThinking)return;
 aiThinking=true;msg.textContent="AI 正在思考……";
 const token=++aiTimerToken;
 setTimeout(()=>{
  if(token!==aiTimerToken){aiThinking=false;return}
  aiThinking=false;
  if(!aiEnabled||side!=="black"||over)return;
  const move=chooseAiMove();
  if(move)makeMove(move.p,move.x,move.y);
 },aiLevel===1?350:650);
}
function clickPoint(x,y){if(over)return;const p=at(x,y);
 if(selected){if(legal(selected,x,y)){makeMove(selected,x,y);return}if(p&&red(p.c)===(side==="red")){selected=p;msg.textContent="已选择 "+name[p.c]+"，请选择目标位置";render();return}msg.textContent="这里不能走";return}
 if(p&&red(p.c)===(side==="red")){selected=p;msg.textContent="已选择 "+name[p.c]+"，请选择目标位置";render()}
}
function addMarker(x,y,cls){const m=document.createElement("i");m.className="marker "+cls;m.style.left=(5.5+x*11.125-1.05)+"%";m.style.top=(4.8+y*10.044444-1.0)+"%";board.appendChild(m)}
function render(){
 board.querySelectorAll(".point,.marker").forEach(e=>e.remove());
 [[0,3,"tl"],[2,3,"tl"],[4,3,"tl"],[6,3,"tl"],[8,3,"tr"],[1,2,"tl"],[7,2,"tr"],[0,6,"bl"],[2,6,"bl"],[4,6,"bl"],[6,6,"br"],[8,6,"br"],[1,7,"bl"],[7,7,"br"]].forEach(v=>addMarker(v[0],v[1],v[2]));
 for(let y=0;y<10;y++)for(let x=0;x<9;x++){
  const pt=document.createElement("div");pt.className="point";pt.style.left=(5.5+x*11.125)+"%";pt.style.top=(4.8+y*10.044444)+"%";
  const p=at(x,y);
  if(last&&((last.ox===x&&last.oy===y)||(last.x===x&&last.y===y)))pt.classList.add("last");
  if(p){const el=document.createElement("div");el.className="piece "+(red(p.c)?"red":"black");el.textContent=name[p.c];pt.appendChild(el)}
  if(selected&&selected.x===x&&selected.y===y)pt.classList.add("selected");
  if(selected&&movesFor(selected).some(v=>v[0]===x&&v[1]===y))pt.classList.add(p?"capture":"legal");
  pt.onclick=()=>clickPoint(x,y);board.appendChild(pt);
 }
 const chk=inCheck(side);turnEl.textContent=over?"对局结束":(side==="red"?"红方":"黑方")+" · "+(chk?"将军":"走棋");
}
function renderMoves(){
 if(!history.length){movesEl.textContent="暂无走棋记录";return}
 movesEl.innerHTML=history.map((h,i)=>'<div class="move-row"><span class="move-no">'+(Math.floor(i/2)+1)+(i%2===0?".":"...")+'</span><span class="'+(h.check?"check":"")+'">'+(h.note||"")+'</span></div>').join("");
 movesEl.scrollTop=movesEl.scrollHeight;
}
document.querySelector("#aiToggle").onclick=()=>{aiEnabled=!aiEnabled;document.querySelector("#aiToggle").textContent="🤖 AI："+(aiEnabled?"开启（黑方）":"关闭");if(aiEnabled&&side==="black")scheduleAi()};
document.querySelector("#aiDepth").onclick=()=>{aiLevel=aiLevel===1?2:1;document.querySelector("#aiDepth").textContent=aiLevel===1?"难度：随机优选":"难度：更认真"};
document.querySelector("#reset").onclick=()=>{
 aiTimerToken++;
 aiThinking=false;
 initial();
};
document.querySelector("#undo").onclick=()=>{
 aiTimerToken++;
 aiThinking=false;
 if(!history.length)return;
 let h=history.pop();
 if(aiEnabled&&h.side==="red"&&history.length)h=history.pop();
 if(!h)return;
 pieces.length=0;
 for(const q of h.pieces)pieces.push({...q});
 side=h.side;last=h.last;positionCounts={...h.positionCounts};selected=null;over=false;
 msg.textContent="已悔棋";
 render();renderMoves();
};
initial();
</script></body></html>
